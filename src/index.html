<!DOCTYPE html>
<html>
<head>
    <title>Maze Memory Game</title>
    <link rel="stylesheet" href="./styles_new.css"/>
</head>
<body>
<header>
    <h1 class="site-title">Maze Memory Game</h1>
</header>
<main>
    <div class="site-layout">

        <div class="site-game-menue">
            <fieldset>
                <legend>Game Menue</legend>
                <input
                        type="number"
                        id="rows"
                        placeholder="enter rows"
                        required/>
                <input
                        type="number"
                        id="columns"
                        placeholder="enter columns"
                        required/>

                <p>
                    <button id="start-button">Start Game</button>
                </p>
            </fieldset>
        </div>

        <section class="site-game-section">
            <h2>Maze Memory</h2>
            <div class="game-section-board" id="board">

            </div>

            <div class="site-game-stats">
                <section class="site-game-scoreboard">
                    <h3>Score</h3>

                    <div class="scoreboard-rows">
                        <label>Score: <a id="scoreboard-score"></a></label>
                    </div>
                    <div class="scoreboard-rows">
                        <label>Missed: <a id="scoreboard-missed"></a></label>
                    </div>


                </section>

            </div>
        </section>

        <div class="free">

        </div>

    </div>
    <script type="module" src="Game.js"></script>
    <script type="module" src="./modules/GameLogic.js"></script>
    <script type="module" src="./modules/GameManager.js"></script>
    <script type="module" src="modules/Renderer.js"></script>

</main>
</body>
</html>
